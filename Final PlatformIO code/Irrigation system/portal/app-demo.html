.sw{-webkit-appearance:none;appearance:none;position:relative;flex:none;width:51px;height:31px;border-radius:16px;background:var(--fd);box-shadow:var(--sw0);outline:0;transition:background .25s,box-shadow .25s;cursor:pointer;margin:0}

    ch.push({t:t('ch_tank'),u:'%',dec:0,gap:qs*2,s:[{n:t('ch_tank'),c:zcol(0),d:series(Q,qs,9)}]});
    ch.push({t:t('ch_temp'),u:'°C',dec:1,gap:qs*2,minR:2,s:[{n:t('ch_temp'),c:zcol(0),d:series(Q,qs,10)}]});
    ch.push({t:t('ch_hum'),u:'%',dec:0,gap:qs*2,minR:5,s:[{n:t('ch_hum'),c:zcol(0),d:series(Q,qs,11)}]});
  }
  ST.full=[x0,x1];if(!ST.v)ST.v=[x0,x1];
  ch.forEach(function(o){
    var has=function(s){return s.d.some(function(p){return p[1]!=null&&(!o.bars||p[1]>0)})};
    if(o.lg&&o.s.length>1){var keep=o.s.filter(has);if(keep.length){o.lg=o.lg.filter(function(x){return x[2]=='band'||keep.some(function(s){return s.n==x[0]})});o.s=keep}}
    var b=chartBox(sc,o.t,o.lg);o.cv=b.cv;o.x0=ST.v[0];o.x1=ST.v[1];ST.ch.push(o);
    chartHover(b,function(){return o});zoomable(b.cv);
  });
  redrawStats();
}
function redrawStats(){ST.ch.forEach(function(o){o.x0=ST.v[0];o.x1=ST.v[1];o.fx=ST.full;drawChart(o.cv,o)})}
var rdQ=0;function redrawSoon(){if(!rdQ)rdQ=requestAnimationFrame(function(){rdQ=0;redrawStats()})}
function zoomable(cv){
  var pts={},d0=0,v0=null,mid=0;
  function clampV(a,b){var F=ST.full,mn=ST.r=='3h'?5*60e3:3*36e5,w=Math.max(mn,Math.min(F[1]-F[0],b-a));if(a<F[0]){a=F[0]}if(a+w>F[1])a=F[1]-w;return [a,a+w]}
  function tAt(x){var r=cv.getBoundingClientRect(),o=ST.ch[0];return ST.v[0]+(x-r.left-(o._L||0))/(o._pw||1)*(ST.v[1]-ST.v[0])}
  function zoom(f,t0){var a=t0-(t0-ST.v[0])*f,b=t0+(ST.v[1]-t0)*f;ST.v=clampV(a,b);redrawSoon()}
  cv.addEventListener('wheel',function(e){if(!e.ctrlKey&&Math.abs(e.deltaY)<Math.abs(e.deltaX))return;e.preventDefault();zoom(Math.exp(e.deltaY*.002),tAt(e.clientX))},{passive:false});
  cv.addEventListener('dblclick',function(){ST.v=ST.full.slice();redrawSoon()});
  cv.addEventListener('pointerdown',function(e){pts[e.pointerId]={x:e.clientX,y:e.clientY};v0=ST.v.slice();var k=Object.keys(pts);
    if(k.length==2){var a=pts[k[0]],b=pts[k[1]];d0=Math.abs(a.x-b.x)||1;mid=tAt((a.x+b.x)/2)}else{d0=0;mid=e.clientX}
    if(e.pointerType=='mouse')try{cv.setPointerCapture(e.pointerId)}catch(x){}});
  cv.addEventListener('pointermove',function(e){if(!pts[e.pointerId])return;pts[e.pointerId]={x:e.clientX,y:e.clientY};var k=Object.keys(pts);
    if(k.length==2&&d0){var a=pts[k[0]],b=pts[k[1]],f=d0/(Math.abs(a.x-b.x)||1);ST.v=clampV(mid-(mid-v0[0])*f,mid+(v0[1]-mid)*f);redrawSoon()}
    else if(k.length==1&&(e.pointerType=='mouse'?e.buttons:1)){var o=ST.ch[0],dx=e.clientX-mid,dt=dx/(o._pw||1)*(v0[1]-v0[0]);
      if(Math.abs(dx)>4||e.pointerType=='mouse'){ST.v=clampV(v0[0]-dt,v0[1]-dt);redrawSoon()}}});
  var up=function(e){delete pts[e.pointerId];v0=ST.v.slice();d0=0;var k=Object.keys(pts);if(k.length==1)mid=pts[k[0]].x};
  cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
}

// ----- the zone page's soil chart -----

    if(ZCH.id!==my)return;ZCH.q=parseCsv(x);ZCH.o=1;if(view=='v2')drawZChart()}).catch(function(){});

  var name=t('soil')+(est?' ('+t('est')+')':''),cv=el('canvas'),tip=el('div','chtip');tip.hidden=true;c.appendChild(cv);c.appendChild(tip);

  c.appendChild(lg);cv.setAttribute('role','img');cv.setAttribute('aria-label',name);
  var o={x0:x0,x1:x1,u:'%',dec:1,gap:qs*2,band:[z.lo,z.hi,zcol(0)],fix:[0,100],sh:sh,s:[{n:name,c:zcol(0),d:series(Q,qs,col)}]};
  drawChart(cv,o);chartHover({cv:cv,tip:tip},function(){return o});
}
window.addEventListener('resize',function(){clearTimeout(ST.rt);ST.rt=setTimeout(function(){if(view=='v6')redrawStats();if(view=='v2')drawZChart()},150)});
