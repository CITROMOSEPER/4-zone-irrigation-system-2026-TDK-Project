*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

.v{display:none}

.sub{color:var(--t2);margin:0 auto 20px;max-width:26em;font-size:1rem;line-height:1.45}
#v2 h1{margin:12px 0 16px}
.lb{font-size:.8125rem;letter-spacing:.02em;text-transform:uppercase;color:var(--t2);margin:22px 16px 8px}
.list{background:var(--card);border-radius:14px;overflow:hidden;margin:0 0 12px}
.row,.fl{position:relative;display:flex;align-items:center;width:100%;min-height:50px;padding:0 16px;border:0;background:none;text-align:left}
.row+.row:before,.fl+.fl:before{content:"";position:absolute;top:0;left:16px;right:0;height:1px;background:var(--sp)}
.row{transition:background .25s}
.row:active{background:var(--sp);transition:none}
.row.st{color:var(--t2);cursor:default}
.row.st:active{background:none}
.nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.go:after{content:"";flex:none;width:8px;height:8px;margin-left:12px;border:solid var(--t2);border-width:2px 2px 0 0;transform:rotate(45deg);opacity:.55}
.lk{display:flex;margin-left:10px;color:var(--t2)}
.sig{display:flex;align-items:flex-end;height:14px;margin-left:10px}
.sig b{width:3px;margin-left:2px;border-radius:1px;background:var(--sp)}
.sig b:nth-child(1){height:5px}.sig b:nth-child(2){height:8px}.sig b:nth-child(3){height:11px}.sig b:nth-child(4){height:14px}
.l1 b:nth-child(-n+1),.l2 b:nth-child(-n+2),.l3 b:nth-child(-n+3),.l4 b{background:var(--tx)}
.spin{flex:none;width:20px;height:20px;margin-right:12px;border:2.5px solid var(--sp);border-top-color:var(--g);border-radius:50%;animation:rt .8s linear infinite}
.fl label{flex:0 0 6.5rem}
.fl input[type=text],.fl input[type=password]{flex:1;min-width:0;height:50px;border:0;background:none;outline:0;text-overflow:ellipsis}
.fl input[readonly]{color:var(--t2)}
.fl input::placeholder{color:var(--t2);opacity:.7}
.fl:focus-within label{color:var(--g)}
/* eye button inside the password field */
.eye{flex:none;display:flex;align-items:center;justify-content:center;width:44px;height:44px;margin-right:-10px;border:0;border-radius:10px;background:none;color:var(--t2)}
.eye:active{background:var(--sp)}
.eye:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid var(--g);outline-offset:2px}
.er{color:var(--er);font-size:.875rem;line-height:1.35;margin:8px 16px 0;min-height:1.2em}
.btn{display:block;width:100%;min-height:52px;border:0;border-radius:14px;background:var(--g);color:var(--on);font-weight:600;letter-spacing:-.01em;margin-top:20px;transition:transform .12s ease-out,opacity .2s}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.35;transform:none;cursor:default}
.tl{border:0;background:none;color:var(--g);padding:12px 4px;font-size:1rem;text-decoration:none;min-height:44px}
.tl:active{opacity:.5}
.ctr{text-align:center}
.small{font-size:.8125rem;line-height:1.45;letter-spacing:.01em;color:var(--t2);margin:12px 16px}
.bn{display:flex;align-items:center;background:var(--wb);color:var(--er);border-radius:14px;padding:12px 16px;margin:0 0 16px;font-size:.9375rem;line-height:1.35}
.bn span{flex:1}
.bn button{flex:none;margin-left:12px;padding:6px 0;color:inherit;font-weight:600;text-decoration:underline}
.c{padding-top:28px}

  if(busy){nl.appendChild(stRow(t('scan'),1));return}
  if(!nets.length){nl.appendChild(stRow(t('none')));return}
  for(i=0;i<nets.length;i++){
    n=nets[i];b=el('button','row go');b.type='button';b.appendChild(el('span','nm',n.s));
    if(!n.o){k=el('span','lk');k.innerHTML=LOCK;b.appendChild(k)}
    g=el('span','sig l'+lv(n.r));g.setAttribute('aria-hidden','true');for(j=0;j<4;j++)g.appendChild(el('b'));b.appendChild(g);
    b.onclick=(function(n){return function(){choose(n.s,n.o,0)}})(n);nl.appendChild(b);
  }
}
function poll(){
  fetch('/scan',{cache:'no-store'}).then(function(r){
    if(r.status==404)return get('/ping',2500).then(function(x){return x.text()}).then(function(x){if(x=='ok')online();else throw 0});
    return r.json().then(function(j){
    ap=j.a||ap;host=j.h||host;
    if(j.j&&resume(j.j))return;     // reopened while joining or joined: carry on there
    if(j.w){setTimeout(poll,1000);return}
    nets=j.n||[];host=j.h||host;ap=j.a||ap;fl=j.f;fs=j.v||'';busy=0;draw();
  })}).catch(function(){setTimeout(poll,1500)});
}
function resume(j){
  if(j.s=='conn'){saved=j.v;vx();nav('v3');jwait();return 1}
  if(j.s=='ok'){saved=j.v;ip=j.ip;vx();nav('v4');
    if(location.hostname!=AP)finish();   // opened as name.local or its new IP: they want the app
    return 1}
  return 0;
}
function rescan(){busy=1;draw();fetch('/rescan',{cache:'no-store'}).then(poll).catch(function(){setTimeout(poll,2000)})}

// ---- views ----
function nav(v,bk){
  $(cur).className='v';$(v).className='v on'+(bk?' bk':'');cur=v;
  $('back').className='ib'+(v=='v2'?'':' hid');
  window.scrollTo(0,0);
}
function choose(s,o,m){
  var a=$('ssid'),p=$('pass');
  pick={s:s,o:o,m:m};a.value=s||'';a.readOnly=!m;
  p.value='';showPw(false);
  $('pr').hidden=!!(o&&!m);p.placeholder=t(need()?'req':'opt');
  ek='';ea='';chk(false);nav('v2');
  if(m)a.focus();else if(!$('pr').hidden)p.focus();
}

// ---- password field: eye button ----
function showPw(on){$('pass').type=on?'text':'password';$('eye').setAttribute('aria-pressed',on?'true':'false');
  $('eye').querySelector('use').setAttribute('href',on?'#eyx':'#ey');eyeLbl()}
function eyeLbl(){$('eye').setAttribute('aria-label',t($('pass').type=='text'?'hide':'show'))}
$('eye').onclick=function(){var p=$('pass'),on=p.type=='password',x=p.selectionStart;showPw(on);try{p.focus();p.setSelectionRange(x,x)}catch(e){}};

// ---- form ----
function err(){$('er').textContent=ek?t(ek,ea||null):''}
// Wrong input is reported at once; merely incomplete input only after the field is left (sh)
function chk(sh){
  var n=trim($('ssid').value),p=$('pass').value,k='',w=1;
  if(/[\u0000-\u001f\u007f]/.test(n)||blen(n)>32)k='e_ssid';
  else if(p&&/[^\x20-\x7e]/.test(p))k='e_chars';
  else{w=0;if(!n)k='e_name';else if(p?p.length<8:need())k='e_len'}
  $('ok').disabled=!!k;
  if(ea&&!sh)return;            // keep the controller's answer (wrong password) until the user edits a field
  ek=(sh||w)?k:'';ea='';
  err();
}
function fin(){$('ok').disabled=false;err()}
function submit(e){
  var s=trim($('ssid').value),p=$('pass').value;
  e.preventDefault();$('ssid').value=s;chk(true);
  if($('ok').disabled)return;
  $('ok').disabled=true;
  fetch('/save',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:'ssid='+encodeURIComponent(s)+'&pass='+encodeURIComponent(p)})
  .then(function(r){return r.json()})
  .then(function(j){
    if(j.ok||j.e=='busy'){saved=s;vx();nav('v3');jwait();$('ok').disabled=false}
    else{ek=j.e=='ssid'?'e_ssid':j.e=='pass'?'e_len':'e_save';fin()}
  }).catch(function(){ek='e_conn';fin()});
}

// ---- joining: the controller tries the network while its setup network stays up ----
// The phone may drop off for a moment when the controller's radio moves to that network's channel;
// polling just carries on, and the controller keeps the result for a reopened page.
function get(u,ms){
  var c=window.AbortController?new AbortController():null,tm=setTimeout(function(){if(c)c.abort()},ms);
  return fetch(u,{cache:'no-store',signal:c?c.signal:undefined}).then(function(r){clearTimeout(tm);return r},function(x){clearTimeout(tm);throw x});
}
function jwait(){okAt=Date.now();$('lost').hidden=true;clearTimeout(jt);jt=setTimeout(jpoll,800)}
function jpoll(){
  if(cur!='v3')return;
  get('/status',2500).then(function(r){return r.json()}).then(function(j){
    okAt=Date.now();$('lost').hidden=true;host=j.h||host;
    if(j.s=='ok'){ip=j.ip;vx();nav('v4');return}
    if(j.s=='fail'){if(!pick)choose(saved,0,0);ek=j.e=='pass'?'f_pass':j.e=='nf'?'f_nf':j.e=='save'?'e_save':'f_to';ea=saved;err();nav('v2',1);
      if(j.e=='pass')try{$('pass').focus()}catch(x){}return}
    if(j.s=='idle'){nav('v1',1);rescan();return}
    jt=setTimeout(jpoll,1000);
  }).catch(function(){
    if(Date.now()-okAt>8000){$('lost').hidden=false;vx()}
    jt=setTimeout(jpoll,1500);
  });
}
function vx(){
  if(!saved)return;
  var a=ap||'Irrigation-Setup',u=ip||host+'.local';
  $('p3').textContent=t('waitp',saved);
  $('lost').textContent=t('lost',a);
  $('p4').textContent=t('okp',saved);
  $('contn').textContent=t('contn',a);
  $('p5').innerHTML=t('dnp',esc(saved));
  $('a3').textContent=u;$('a3').href='http://'+u+'/';
  $('sl').hidden=!slow;
  $('sl').innerHTML='<p>'+t('slow')+'</p><ul><li>'+t('sl1',esc(saved))+'</li>'+(ip?'<li>'+t('sl2',esc(host)+'.local')+'</li>':'')+'<li>'+t('sl3')+'</li><li>'+t('sl4',esc(a))+'</li></ul>';
}
// Continue: the controller switches off its setup network and carries on with the same connection and IP
function finish(){
  var b=$('fin'),n=0;if(b.disabled)return;
  b.disabled=true;
  (function go(){
    fetch('/done',{method:'POST',cache:'no-store'}).then(function(r){return r.json()}).then(function(j){
      if(!j.ok&&j.e=='state'){b.disabled=false;poll();return}   // the controller moved on: ask it where
      gone();
    }).catch(function(){if(++n<3)setTimeout(go,800);else gone()});   // no answer: it has closed already (10 min limit)
    function gone(){b.disabled=false;t0=Date.now();slow=0;vx();nav('v5');setTimeout(ping,2500)}
  })();
}
// Once this device is back on its own network, open the app at the first address that answers
function ping(){
  if(cur!='v5')return;
  var us=[],k=0,done=0;if(ip)us.push('http://'+ip);us.push('http://'+host+'.local');
  us.forEach(function(u){
    get(u+'/ping',1500).then(function(r){return r.text()}).then(function(x){if(x=='ok'&&!done){done=1;location.href=u+'/'}else throw 0})
    .catch(function(){if(++k==us.length&&!done){if(!slow&&Date.now()-t0>10000){slow=1;vx()}setTimeout(ping,1000)}});
  });
}
// Opened while the controller is in station mode (a stale copy of this page): say so, offer the app
function online(){
  nav('v0');
  $('opn').onclick=function(){location.replace('/?app='+Date.now())};   // a new URL, not the stale copy
}

// ---- wiring ----
$('lh').onclick=function(){setL('hu')};$('le').onclick=function(){setL('en')};
$('back').onclick=function(){nav('v1',1)};
$('rs').onclick=rescan;
$('oth').onclick=function(){choose('',0,1)};
$('br').onclick=function(){var i,o=0;for(i=0;i<nets.length;i++)if(nets[i].s==fs)o=nets[i].o;choose(fs,o,0)};
$('ssid').oninput=$('pass').oninput=function(){ea='';ek='';chk(false)};
$('ssid').onchange=$('pass').onchange=function(){chk(true)};
$('fin').onclick=finish;
$('chg').onclick=function(){nav('v1',1);if(!nets.length)rescan()};
$('f').onsubmit=submit;
window.addEventListener('scroll',function(){$('hd').className=(window.pageYOffset>4)?'sc':''},{passive:true});
tr();poll();
})();
</script>
</body>
